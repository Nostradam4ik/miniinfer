name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure

  # GitHub-hosted runners have no GPU: this job checks that everything compiles and runs the CPU-only
  # tests. The GPU tests are run locally (see CONTRIBUTING.md).
  build:
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.8.1-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-pip
          pip3 install "cmake>=3.24,<4" ninja
      - name: Configure
        run: cmake --preset release
      - name: Build
        run: cmake --build --preset release
      - name: CPU-only tests
        run: ./build/tests sampler
